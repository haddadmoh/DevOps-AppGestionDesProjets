services:

  # ------------------------------------------------------------------
  # BASE DE DONNÉES
  # ------------------------------------------------------------------
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - "3307:3306"          # 3307 côté hôte pour éviter le conflit avec un autre conteneur MySQL déjà sur 3306
    volumes:
      - db_data:/var/lib/mysql          # Volume persistant
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------
  # BACKEND (Spring Boot)
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: test_db
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy       # attend que la DB soit prête, pas juste démarrée
    networks:
      - app_network

  # ------------------------------------------------------------------
  # FRONTEND (Angular)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - app_network

# ----------------------------------------------------------------------
# VOLUMES
# ----------------------------------------------------------------------
volumes:
  db_data:
    driver: local

# ----------------------------------------------------------------------
# RÉSEAU DÉDIÉ
# ----------------------------------------------------------------------
networks:
  app_network:
    driver: bridge
